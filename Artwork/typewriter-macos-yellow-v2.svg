<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Yellow macOS typewriter icon – transcription edition</title>
  <desc id="desc">Cream typewriter with a friendly face, three rounded keys, a subtle transcription motif on the paper and a golden yellow macOS-style tile.</desc>
  <defs>
    <!-- Standalone Mac icon: 824 pt optical tile on a 1024 pt canvas. The continuous corners are an approximation of the system mask. -->
    <path id="tile-shape" d="M330 100 H694 C783 100 831 110 873 152 C915 194 924 241 924 330 V694 C924 783 914 831 872 873 C830 915 783 924 694 924 H330 C241 924 193 914 151 872 C109 830 100 783 100 694 V330 C100 241 110 193 152 151 C194 109 241 100 330 100 Z"/>
    <clipPath id="tile-clip"><use xlink:href="#tile-shape"/></clipPath>
    <linearGradient id="yellow" x1=".18" y1="0" x2=".75" y2="1">
      <stop stop-color="#FFE980"/><stop offset=".38" stop-color="#FFDC56"/><stop offset=".78" stop-color="#FFD03B"/><stop offset="1" stop-color="#F7BE25"/>
    </linearGradient>
    <radialGradient id="ambient-light" cx=".26" cy=".04" r=".92" gradientTransform="translate(0 .015) scale(1 .82)">
      <stop stop-color="#FFF7B0" stop-opacity=".65"/><stop offset=".52" stop-color="#FFED87" stop-opacity=".12"/><stop offset="1" stop-color="#FFF0A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile-rim" x1=".4" y1="0" x2=".6" y2="1">
      <stop stop-color="#FFFCE2" stop-opacity=".92"/><stop offset=".26" stop-color="#FFF6B6" stop-opacity=".62"/><stop offset=".65" stop-color="#FFE48A" stop-opacity=".2"/><stop offset="1" stop-color="#B97700" stop-opacity=".24"/>
    </linearGradient>
    <linearGradient id="body" x1=".22" y1="0" x2=".65" y2="1">
      <stop stop-color="#FFFAE9"/><stop offset=".5" stop-color="#FFF3D7"/><stop offset="1" stop-color="#F5E5BE"/>
    </linearGradient>
    <linearGradient id="cream-edge" x1=".25" y1="0" x2=".6" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".38" stop-color="#FFFDF0" stop-opacity=".8"/><stop offset="1" stop-color="#C3A56E" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="paper" x1=".3" y1="0" x2=".72" y2="1">
      <stop stop-color="#FFFFF6"/><stop offset=".48" stop-color="#FFF8E4"/><stop offset="1" stop-color="#F9EBCB"/>
    </linearGradient>
    <linearGradient id="teal" x1=".18" y1="0" x2=".8" y2="1">
      <stop stop-color="#19565A"/><stop offset=".48" stop-color="#10464A"/><stop offset="1" stop-color="#093438"/>
    </linearGradient>
    <linearGradient id="teal-edge" x1="0" y1="0" x2=".4" y2="1">
      <stop stop-color="#062D32" stop-opacity=".48"/><stop offset=".5" stop-color="#21595B" stop-opacity=".08"/><stop offset="1" stop-color="#A3C3B8" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="key-side" x1=".1" y1="0" x2=".7" y2="1">
      <stop stop-color="#F5E5C2"/><stop offset="1" stop-color="#DDC79A"/>
    </linearGradient>
    <linearGradient id="key-top" x1=".35" y1="0" x2=".55" y2="1">
      <stop stop-color="#FFFFF4"/><stop offset="1" stop-color="#F9EBCB"/>
    </linearGradient>
    <filter id="object-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="contact-shadow" x="-20%" y="-25%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="rim-softness" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <!-- Background and narrow interior light bevel -->
  <g id="Background">
    <use xlink:href="#tile-shape" fill="url(#yellow)"/>
    <use xlink:href="#tile-shape" fill="url(#ambient-light)"/>
    <g clip-path="url(#tile-clip)">
      <use xlink:href="#tile-shape" fill="none" stroke="url(#tile-rim)" stroke-width="10" filter="url(#rim-softness)"/>
      <use xlink:href="#tile-shape" fill="none" stroke="url(#tile-rim)" stroke-width="2.5"/>
    </g>
  </g>
  <!-- The original character's asymmetric silhouette, paper, smile and keys are traced as smooth cubic curves. -->
  <g id="Typewriter" transform="translate(133.4 115.4) scale(.6)">
    <g id="Body-shadow" transform="translate(0 15)" fill="#96600B" opacity=".25" filter="url(#object-shadow)">
      <path d="M132 494 C133 412 172 371 255 356 L842 308 C927 312 1003 370 1035 451 C1060 515 1057 617 1075 689 C1090 750 1138 818 1162 900 C1184 976 1169 1041 1133 1076 C1099 1112 1050 1118 987 1127 C846 1145 612 1168 476 1172 C366 1177 305 1144 236 1085 C174 1031 140 977 135 893 C127 819 134 688 132 494 Z"/>
      <path d="M240 228 C238 202 266 192 303 185 C432 166 630 150 727 150 C777 149 797 159 815 207 C836 261 848 329 859 394 C832 401 707 413 578 424 L337 445 Q316 448 304 442 C288 366 270 300 245 245 Q240 234 240 228 Z"/>
    </g>
    <g id="Cream-shell">
      <path d="M132 494 C133 412 172 371 255 356 L842 308 C927 312 1003 370 1035 451 C1060 515 1057 617 1075 689 C1090 750 1138 818 1162 900 C1184 976 1169 1041 1133 1076 C1099 1112 1050 1118 987 1127 C846 1145 612 1168 476 1172 C366 1177 305 1144 236 1085 C174 1031 140 977 135 893 C127 819 134 688 132 494 Z" fill="url(#body)" stroke="url(#cream-edge)" stroke-width="3.2"/>
      <path d="M154 488 C154 417 194 384 255 374" fill="none" stroke="#FFFDF1" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    </g>
    <g id="Paper-slot">
      <path d="M214 365 C308 333 629 299 836 306 C881 307 934 348 954 386 C984 442 963 470 903 482 C784 503 519 527 385 540 C326 546 299 532 275 491 C256 456 241 436 208 405 C187 385 191 374 214 365 Z" fill="url(#teal)" stroke="url(#teal-edge)" stroke-width="3"/>
    </g>
    <g id="Paper-sheet">
      <path d="M303 434 C450 422 689 401 859 391 L863 409 C724 435 496 452 319 461 Z" fill="#00292B" opacity=".25" filter="url(#contact-shadow)"/>
      <path d="M240 228 C238 202 266 192 303 185 C432 166 630 150 727 150 C777 149 797 159 815 207 C836 261 848 329 859 394 C832 401 707 413 578 424 L337 445 Q316 448 304 442 C288 366 270 300 245 245 Q240 234 240 228 Z" fill="url(#paper)" stroke="url(#cream-edge)" stroke-width="2.5"/>
      <path d="M253 222 C253 204 283 199 311 194 C455 174 634 158 728 158 C767 158 786 167 800 195" fill="none" stroke="#FFFFFF" stroke-opacity=".60" stroke-width="3.4" stroke-linecap="round"/>
    <g id="Transcription-lines" transform="translate(348 241) rotate(-5)" fill="none" stroke="#28585B" stroke-linecap="round" stroke-width="14"><path d="M0 0 H118 M142 0 H292" opacity=".77"/><path d="M0 43 H246" opacity=".57"/><path d="M0 86 H92 M116 86 H173" opacity=".40"/></g></g>
    <g id="Left-knob" transform="translate(17 6) translate(165 600) scale(.88 .92) translate(-165 -600)">
      <path d="M141 496 C187 483 220 501 232 554 C247 618 234 681 207 700 C186 715 148 716 122 699 C95 682 86 636 91 587 C95 539 109 506 141 496 Z" fill="url(#teal)" stroke="url(#teal-edge)" stroke-width="2.6"/>
      <path d="M109 551 C119 519 136 506 162 504" fill="none" stroke="#94C7BF" stroke-opacity=".15" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M144 519 C177 509 201 526 212 566 C224 608 213 660 194 677 C178 692 151 691 133 678" fill="none" stroke="#9CC5BF" stroke-opacity=".22" stroke-width="3.4" stroke-linecap="round"/></g>
    <g id="Face" fill="url(#teal)" stroke="url(#teal-edge)" stroke-width="1.9">
      <path id="Left-eye" d="M533 611 C558 611 578 633 578 661 C578 687 558 710 533 710 C508 710 487 689 487 661 C487 634 507 611 533 611 Z" transform="translate(14 0) translate(533 661) scale(.83) translate(-533 -661)"/>
      <path id="Right-eye" d="M873 582 C898 582 918 604 918 631 C918 658 898 680 873 680 C849 680 829 658 829 632 C829 605 849 582 873 582 Z" transform="translate(-14 0) translate(873 632) scale(.83) translate(-873 -632)"/>
      <path id="Smile" d="M659 681 C666 672 677 671 685 679 C697 691 718 692 731 676 C738 667 750 668 755 676 C763 688 752 700 742 708 C722 723 689 724 669 709 C658 701 652 691 659 681 Z" transform="translate(705 696) scale(.88 .92) translate(-705 -696)"/>
    </g>
    <g id="Keyboard">
      <path d="M339 916 C346 864 397 851 475 841 C630 822 861 802 971 797 C1032 793 1058 806 1082 851 C1096 878 1117 936 1118 961 C1121 998 1097 1010 1060 1019 C961 1040 641 1068 520 1075 C453 1079 420 1071 389 1038 C365 1013 331 951 339 916 Z" fill="url(#teal)" stroke="url(#teal-edge)" stroke-width="3"/>
      <g id="Key-shadows" transform="translate(1 7)" fill="#042A2D" opacity=".48" filter="url(#contact-shadow)">
        <path d="M428 952 C428 899 460 876 516 876 C574 876 607 896 607 946 V965 C607 1006 576 1028 518 1028 C465 1028 428 1006 428 967 Z"/>
        <path d="M657 930 C657 880 691 855 747 855 C803 855 836 877 836 926 V948 C836 988 806 1006 748 1006 C692 1006 657 985 657 946 Z"/>
        <path d="M880 909 C880 861 912 839 966 839 C1023 839 1051 862 1052 906 V928 C1052 966 1021 985 967 985 C913 985 879 965 879 927 Z"/>
      </g>
      <g id="Left-key">
        <path d="M429 924 C430 891 465 874 517 874 C572 874 605 895 606 931 L606 962 C605 1004 571 1026 518 1026 C466 1026 428 1005 428 965 Z" fill="url(#key-side)"/>
        <path d="M430 923 C433 890 468 871 516 871 C565 871 604 891 606 927 C608 962 572 983 521 983 C467 983 432 963 430 923 Z" fill="url(#key-top)" stroke="url(#cream-edge)" stroke-width="2.5"/>
      </g>
      <g id="Middle-key">
        <path d="M658 903 C662 869 697 852 747 852 C798 852 834 873 836 908 L835 941 C834 981 803 1005 747 1005 C693 1005 656 981 657 943 Z" fill="url(#key-side)"/>
        <path d="M659 903 C662 870 699 850 746 850 C796 850 834 870 835 905 C837 941 802 962 748 962 C695 962 659 940 659 903 Z" fill="url(#key-top)" stroke="url(#cream-edge)" stroke-width="2.5"/>
      </g>
      <g id="Right-key">
        <path d="M881 888 C884 855 916 837 966 837 C1017 837 1049 858 1051 894 L1051 924 C1050 962 1019 984 966 984 C914 984 879 961 879 925 Z" fill="url(#key-side)"/>
        <path d="M882 887 C884 853 919 834 966 834 C1015 834 1049 854 1051 889 C1053 924 1019 944 968 944 C917 944 882 923 882 887 Z" fill="url(#key-top)" stroke="url(#cream-edge)" stroke-width="2.5"/>
      </g>
    </g>
  </g>
</svg>
