name: Remove legacy releases
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-legacy-releases.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete the seven confirmed legacy releases
        run: |
          for release in 454286964 454282377 454269055 453973299 453945843 453913935 453760633; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release"
          done
