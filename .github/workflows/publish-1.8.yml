name: Publish Sayso 1.8
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1.8.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build, sign and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(uname -m)" = arm64
          bash build.sh "$PWD/Sayso-1.8-macOS-arm64.zip"
          gh release create v1.8 Sayso-1.8-macOS-arm64.zip --target "$GITHUB_SHA" --title "Sayso 1.8" --notes "Eight microphone-reactive bars fold into a spinning ring during transcription. This release also improves Check for Updates and adds a direct link to GitHub Releases."
