name: Publish Sayso 1.0.13
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1.0.13.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build, sign and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(uname -m)" = arm64
          bash build.sh "$PWD/Sayso-1.0.13-macOS-arm64.zip"
          gh release create v1.0.13 Sayso-1.0.13-macOS-arm64.zip --target "$GITHUB_SHA" --title "Sayso 1.0.13" --latest --notes "The recording indicator has a slightly larger, fixed-size capsule that keeps the waveform inside as it turns into the processing spinner."
          gh api repos/"$GITHUB_REPOSITORY"/releases/latest --jq '.tag_name' | grep -Fx v1.0.13
          gh release view v1.0.13 --json assets --jq '.assets[].name' | grep -Fx Sayso-1.0.13-macOS-arm64.zip
