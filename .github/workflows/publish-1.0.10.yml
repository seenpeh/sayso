name: Publish Sayso 1.0.10
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1.0.10.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build, sign and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(uname -m)" = arm64
          bash build.sh "$PWD/Sayso-1.0.10-macOS-arm64.zip"
          gh release create v1.0.10 Sayso-1.0.10-macOS-arm64.zip --target "$GITHUB_SHA" --title "Sayso 1.0.10" --latest --notes "The eight recording bars curl into a clockwise ring in order as the capsule contracts around them. If you use 1.1 through 1.9, download this release manually once to switch to the new numbering."
          gh api repos/"$GITHUB_REPOSITORY"/releases/latest --jq '.tag_name' | grep -Fx v1.0.10
          gh release view v1.0.10 --json assets --jq '.assets[].name' | grep -Fx Sayso-1.0.10-macOS-arm64.zip
